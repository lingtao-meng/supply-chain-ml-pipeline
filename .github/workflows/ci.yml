name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install -q "ruff>=0.6"
      - name: Lint
        run: ruff check .
      - name: Byte-compile
        run: python -m compileall -q src scripts app tests

  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies (no dataset needed)
        run: |
          python -m pip install --upgrade pip
          pip install -q numpy pandas scikit-learn scipy joblib
      - name: Unit tests
        run: python -m unittest discover -s tests -v

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -q -r requirements.txt
      - name: Synthetic dataset
        run: python tests/fixtures/make_synthetic_dataco.py /tmp/dataco_small.csv
      - name: Full pipeline on synthetic data
        run: |
          python scripts/refresh_cost_analysis.py \
            --data /tmp/dataco_small.csv --fast --no-cache \
            --outdir /tmp/results --images /tmp/images
      - name: Check artifacts
        run: |
          test -f /tmp/results/summary.md
          test -f /tmp/results/policy_comparison.csv
          test -f /tmp/results/diagnostics.json
          test -f /tmp/images/policy_costs.png
          test -f models/model_bundle.joblib
      - name: Batch scoring CLI
        run: |
          python - <<'PY'
          import pandas as pd
          df = pd.read_csv("/tmp/dataco_small.csv").drop_duplicates("Order Id").head(80)
          df.to_csv("/tmp/orders_sample.csv", index=False)
          PY
          python scripts/score_orders.py --input /tmp/orders_sample.csv --out /tmp/decisions.csv --budget 2000
          python - <<'PY'
          import pandas as pd
          plan = pd.read_csv("/tmp/decisions.csv")
          assert len(plan) == 80
          assert plan["recommended_action"].isin(["none", "notify", "express"]).all()
          assert plan["expected_saving"].notna().all()
          print(plan["recommended_action"].value_counts().to_dict())
          PY
      - name: Drift report
        run: |
          python scripts/drift_report.py --data /tmp/dataco_small.csv --outdir /tmp/drift --images /tmp/drift_images
          test -f /tmp/drift/drift_report.csv
          test -f /tmp/drift/drift_summary.json
      - name: API tests
        run: |
          pip install -q -r requirements-service.txt
          python -m unittest tests.test_api -v
      - name: Monitoring, pacing, intervention
        run: |
          python - <<'PY'
          import pandas as pd
          df = pd.read_csv("/tmp/dataco_small.csv")
          cut = int(len(df) * 0.7)
          df.iloc[:cut].to_csv("/tmp/ref.csv", index=False)
          df.iloc[cut:].to_csv("/tmp/cur.csv", index=False)
          PY
          set +e
          python scripts/monitor.py --reference /tmp/ref.csv --current /tmp/cur.csv --out /tmp/monitor.json
          code=$?
          set -e
          test $code -le 1
          test -f /tmp/monitor.json
          python scripts/pacing_simulation.py --data /tmp/dataco_small.csv --outdir /tmp/results --images /tmp/images
          python scripts/intervention_analysis.py --data /tmp/dataco_small.csv --outdir /tmp/results --images /tmp/images
          test -f /tmp/results/pacing.csv
          test -f /tmp/results/intervention_summary.json
          python scripts/ab_analysis.py --outdir /tmp/results --images /tmp/images --n-per-arm 500
          test -f /tmp/results/ab_analysis.json
          test -f /tmp/images/ab_analysis.png
          python scripts/uplift_analysis.py --data /tmp/dataco_small.csv --outdir /tmp/results --images /tmp/images
          test -f /tmp/results/uplift.json
          test -f /tmp/images/uplift.png
      - name: Docker build and health check
        run: |
          docker build -t delay-api .
          docker run -d --name delay-api -p 8000:8000 delay-api
          for i in $(seq 1 30); do
            if curl -sf localhost:8000/health | grep -q '"model_loaded":true'; then break; fi
            sleep 1
          done
          curl -sf localhost:8000/health | grep -q '"model_loaded":true'
          docker stop delay-api
      - name: Streamlit app smoke test
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest
          app = AppTest.from_file("app/app.py", default_timeout=120).run()
          assert not app.exception, app.exception
          print("app rendered, metric widgets:", len(app.metric))
          PY
